services:
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      args:
        BACKEND_ORIGIN: http://backend:8000
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-real}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-real}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - cms_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cms:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/cms
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      MEDIA_ROOT: /app/media
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    networks:
      - cms_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cms_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:

networks:
  cms_net:
    driver: bridge
    internal: true
